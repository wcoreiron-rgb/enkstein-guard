# Acceptance-only overlay: Guard state and archive volumes on small tmpfs
# filesystems so a full disk can be produced safely without touching the
# Docker host's disk. A holder container keeps the tmpfs volumes mounted for
# the whole run (a tmpfs volume is emptied when no container mounts it).
services:
  state-holder:
    image: ${GUARD_IMAGE:-enkstein-guard:local}
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [sleep, "86400"]
    volumes:
      - guard-state:/state
      - guard-archive:/archive
volumes:
  guard-state:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=${GUARD_STATE_TMPFS:-24m},uid=10001,gid=10001,mode=0700"}
  guard-archive:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=${GUARD_ARCHIVE_TMPFS:-8m},uid=10001,gid=10001,mode=0700"}
